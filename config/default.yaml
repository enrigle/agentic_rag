chroma_path: ./chroma_db
bm25_path: ./bm25_index
collection_name: notion_kb
max_tool_calls: 5
embed_backend: ollama

llm:
  model: llama3.2
  embed_model: nomic-embed-text
  base_url: http://localhost:11434

retriever:
  min_similarity: 0.50
  top_n: 20
  rrf_k: 60
  bm25_top_k: 10
  reranker_model: cross-encoder/ms-marco-MiniLM-L-2-v2
  reranker_top_k: 5
  # Cross-encoder gate over raw logits; null disables it entirely (reranker
  # only reorders, never drops), which lets off-topic queries stick to
  # whatever noise crossed min_similarity instead of falling through to web.
  # ms-marco-MiniLM-L-2-v2 on this corpus: real matches score -1..-7,
  # off-topic queries score -10..-12 — empirically calibrated on this KB,
  # not a general constant. Re-check this gap if reranker_model or the
  # corpus domain changes.
  reranker_min_score: -8.0
  few_shot_max: 3

ingestion:
  chunk_size: 800
  chunk_overlap: 100
  vision_model: ""

groq:
  model: "openai/gpt-oss-20b"

azure_openai:
  endpoint: ""
  deployment: "gpt-4o-mini"
  api_version: "2024-02-01"

redis:
  url: "redis://localhost:6379"
  ttl_seconds: 3600
  similarity_threshold: 0.95
